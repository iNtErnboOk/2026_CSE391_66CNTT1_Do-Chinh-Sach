<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <div class="container">
        <div class="form">
          <form class="form-content">
            <input
              type="text"
              placeholder="Họ tên"
              name="name"
              id="name"
              required
            />
            <input
              type="number"
              placeholder="Điểm"
              name="point"
              id="point"
              required
            />
            <button type="submit" id="submit">Thêm</button>
          </form>
        </div>
        <div class="table-content">
          <table>
            <thead>
              <tr>
                <th>STT</th>
                <th>Họ tên</th>
                <th>Điểm</th>
                <th>Xếp loại</th>
                <th>Thao tác</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        <div class="footer">
          <span id="thongKe"></span>
          <p id="TB"></p>
        </div>
      </div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
